[project]
name = "personal-library"
version = "0.1.0"
description = "Консольное приложение для учёта домашней библиотеки (JSON + TXT + CSV)"
authors = [{name = "Student", email = "student@example.com"}]
requires-python = ">=3.9"
dependencies = ["pytest"]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
library = "library_app.cli:run"

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
python_files = "test_*.py"
addopts = "-ra"
