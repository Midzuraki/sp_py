[project]
name = "shop-db"
version = "0.1.0"
description = "SQLite: две связанные таблицы (поставщики и товары), CRUD через Python"
authors = [{name = "Student", email = "student@example.com"}]
requires-python = ">=3.9"
dependencies = []  # sqlite3 входит в стандартную библиотеку

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
